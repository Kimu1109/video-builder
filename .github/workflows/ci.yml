name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install OpenAL, software OpenGL ES, a Japanese font and FFmpeg's codec libraries
        run: sudo apt-get update && sudo apt-get install -y nasm libx264-dev libx265-dev libvpx-dev libopus-dev libdav1d-dev libffmpeg-nvenc-dev libva-dev libdrm-dev libopenal1 fonts-ipafont-gothic libegl1 libgles2 libgl1-mesa-dri xvfb
      # Ubuntu 24.04 の FFmpeg は 6.1 なので、配布物と同じ FFmpeg 9 (x264・x265 入り) をソースから作る (設計書 22.31)。
      # 作ったものはキャッシュする (作り方の script が変わったら作り直す)
      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('packaging/ffmpeg/build.sh') }}
      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: packaging/ffmpeg/build.sh --prefix "$HOME/ffmpeg"
      - name: Use FFmpeg
        run: |
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/ffmpeg/lib" >> "$GITHUB_ENV"
          echo "VIDEO_BUILDER_FFMPEG=$HOME/ffmpeg/lib" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build -warnaserror:CS8600,CS8602,CS8604
      - name: Test
        # X サーバー (仮想) の上で動かし、ほかのアプリからのドロップ (XDND) のテストも実行する
        run: xvfb-run -a dotnet test --no-build
        env:
          VB_REQUIRE_FFMPEG: "1"
