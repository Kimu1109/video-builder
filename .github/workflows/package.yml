name: Package

# Linux (x64・arm64)・Windows・macOS 向けに、FFmpeg 9 (x264・x265 入り) を作って同梱した配布物を作る (設計書 22.34・22.36)。
# Linux は発行したフォルダ (tar.gz) と AppImage を作る。
# FFmpeg はその OS の上でしか作れないので、それぞれの OS のランナーで packaging/ffmpeg/build.sh を実行する。
# 作った FFmpeg だけで (開発用のライブラリを見ずに) 動くことを、テストの一部を流して確かめる。
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - packaging/**
      - .github/workflows/package.yml
      - src/VideoBuilder.Media/FFmpegLoader.cs

env:
  # NVENC のヘッダ。13.x は新しいドライバ (570 以降) でないと NVENC が使えないので 12.1 にする (Ubuntu 24.04 と同じ)
  NV_CODEC_HEADERS_COMMIT: 1889e62e2d35ff7aa9baca2bceb14f053785e6f1   # n12.1.14.0
  # FFmpeg を読み込んで、アニメーション WebP のデコード・描画と、x264・x265 があることを確かめるテスト
  SMOKE_TESTS: FullyQualifiedName~AnimatedImageTests|FullyQualifiedName~PackagingTests|FullyQualifiedName~FFmpegBuildTests

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm   # arm64 のランナー (FFmpeg はその CPU の上でしか作れない)
            arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      RID: linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # AppImage の名前に git describe の結果を使う
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install codec libraries
        # file・desktop-file-utils は appimagetool が使う
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm pkg-config libx264-dev libx265-dev libvpx-dev libdav1d-dev libopus-dev libffmpeg-nvenc-dev libva-dev libdrm-dev patchelf file desktop-file-utils
      - name: Build FFmpeg
        # prefix は appimage/build.sh と同じ場所にして、AppImage を作るときに使い回す
        run: packaging/ffmpeg/build.sh --prefix "artifacts/ffmpeg/$RID" --bundle "artifacts/ffmpeg-bundle/$RID"
      - name: Check that the bundle refers to itself for the bundled libraries
        # 同梱したライブラリ (x264 など) を、ランナーに入っている開発用のものではなく、同梱のものから読むこと (RPATH が $ORIGIN)
        run: |
          bundle="$PWD/artifacts/ffmpeg-bundle/$RID"
          bad=0
          for f in "$bundle"/*.so*; do
            while read -r name path; do
              [ -e "$bundle/$name" ] || continue
              if [ "$path" != "$bundle/$name" ]; then echo "$(basename "$f"): $name -> $path"; bad=1; fi
            done < <(ldd "$f" | awk '$2 == "=>" {print $1, $3}')
            if ldd "$f" | grep -q 'not found'; then ldd "$f"; bad=1; fi
          done
          exit $bad
      - name: Smoke test with the bundled FFmpeg only
        env:
          VB_REQUIRE_FFMPEG: "1"
        run: |
          export VIDEO_BUILDER_FFMPEG="$PWD/artifacts/ffmpeg-bundle/$RID"
          dotnet test tests/VideoBuilder.Tests --filter "$SMOKE_TESTS"
      - name: Publish
        run: |
          packaging/publish-all.sh "$RID"
          tar -C artifacts/publish -czf "artifacts/video-builder-$RID.tar.gz" --transform "s|^$RID|video-builder|" "$RID"
      - uses: actions/upload-artifact@v4
        with:
          name: video-builder-${{ env.RID }}
          path: artifacts/video-builder-${{ env.RID }}.tar.gz
      - name: Install appimagetool
        # ランナーには FUSE がないので、展開して動かす (APPIMAGE_EXTRACT_AND_RUN)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/bin/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage"
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
      - name: Build AppImage
        run: packaging/appimage/build.sh ${{ matrix.arch }}
      - name: Check the AppImage
        run: |
          app=$(ls artifacts/appimage/*-${{ matrix.appimage_arch }}.AppImage)
          file "$app"
          # 中の実行ファイルと FFmpeg がこの CPU 向けであること
          file artifacts/appimage/video-builder.AppDir/usr/bin/video-builder artifacts/appimage/video-builder.AppDir/usr/bin/ffmpeg/libavcodec.so.63 \
            | tee /dev/stderr | grep -c "${{ matrix.arch == 'arm64' && 'aarch64' || 'x86-64' }}" | grep -qx 2
      - uses: actions/upload-artifact@v4
        with:
          name: video-builder-${{ matrix.appimage_arch }}.AppImage
          path: artifacts/appimage/*.AppImage

  # Flatpak。packaging/flatpak/build.sh (発行 → flatpak-builder) を、その CPU のランナーでそのまま実行する。
  # FFmpeg・x264・x265・OpenAL はマニフェストの中でソースから作る (時間がかかるので、flatpak-builder の状態をキャッシュする)。
  # flatpak-github-actions のコンテナは、入っている SDK の更新に失敗する (Invalid cross-device link) ので使わない
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            flatpak_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            flatpak_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install flatpak-builder and the Freedesktop 25.08 runtime
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive --arch=${{ matrix.flatpak_arch }} flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Cache flatpak-builder
        uses: actions/cache@v4
        with:
          path: artifacts/flatpak/.flatpak-builder
          key: flatpak-builder-${{ matrix.flatpak_arch }}-${{ hashFiles('packaging/flatpak/io.github.kimu1109.VideoBuilder.yml') }}
          restore-keys: flatpak-builder-${{ matrix.flatpak_arch }}-
      - name: Build Flatpak
        env:
          FLATPAK_BUILDER_ARGS: --disable-rofiles-fuse
        run: packaging/flatpak/build.sh --bundle --arch ${{ matrix.arch }}
      - name: Check the installed app
        run: |
          flatpak info --user io.github.kimu1109.VideoBuilder
          # サンドボックスの中に、FFmpeg 9 と、この CPU 向けの本体があること (ELF の e_machine: x86-64 は 3e、aarch64 は b7)
          machine=$(flatpak run --user --command=sh io.github.kimu1109.VideoBuilder -c \
            'ls /app/lib/libavcodec.so.63 >&2 && od -An -tx1 -j18 -N1 /app/lib/video-builder/video-builder' | tr -d ' ')
          echo "e_machine=$machine"
          [ "$machine" = "${{ matrix.arch == 'arm64' && 'b7' || '3e' }}" ]
      - uses: actions/upload-artifact@v4
        with:
          name: video-builder-${{ matrix.arch }}.flatpak
          path: artifacts/flatpak/video-builder-${{ matrix.arch }}.flatpak

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit   # dotnet を使えるようにする
          install: make diffutils curl xz tar git
          pacboy: toolchain:p nasm:p pkgconf:p x264:p x265:p libvpx:p dav1d:p opus:p amf-headers:p
      - name: Install NVENC headers
        run: |
          git clone https://github.com/FFmpeg/nv-codec-headers.git "$RUNNER_TEMP/nv-codec-headers"
          cd "$RUNNER_TEMP/nv-codec-headers"
          git checkout "$NV_CODEC_HEADERS_COMMIT"
          make install PREFIX="$MINGW_PREFIX"
      - name: Build FFmpeg
        run: packaging/ffmpeg/build.sh --prefix "$(cygpath -u "$RUNNER_TEMP")/ffmpeg" --bundle artifacts/ffmpeg-bundle/win-x64
      - name: Smoke test with the bundled FFmpeg only
        # MSYS2 の PATH を使わない (同梱したものだけで読み込めることを確かめる)
        shell: pwsh
        env:
          VB_REQUIRE_FFMPEG: "1"
        run: |
          $env:VIDEO_BUILDER_FFMPEG = (Resolve-Path artifacts/ffmpeg-bundle/win-x64).Path
          dotnet test tests/VideoBuilder.Tests --filter "$env:SMOKE_TESTS"
      - name: Publish
        run: packaging/publish-all.sh win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: video-builder-win-x64
          path: artifacts/publish/win-x64

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon
            rid: osx-arm64
          - runner: macos-15-intel     # Intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install codec libraries
        run: brew install nasm pkgconf x264 x265 libvpx dav1d opus
      - name: Build FFmpeg
        run: packaging/ffmpeg/build.sh --prefix "$RUNNER_TEMP/ffmpeg" --bundle "artifacts/ffmpeg-bundle/${{ matrix.rid }}"
      - name: Check that the bundle refers only to itself and the OS
        run: |
          bad=$(otool -L artifacts/ffmpeg-bundle/${{ matrix.rid }}/*.dylib | grep -vE ':$|@loader_path/|/usr/lib/|/System/' || true)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - name: Smoke test with the bundled FFmpeg only
        env:
          VB_REQUIRE_FFMPEG: "1"
        run: |
          export VIDEO_BUILDER_FFMPEG="$PWD/artifacts/ffmpeg-bundle/${{ matrix.rid }}"
          dotnet test tests/VideoBuilder.Tests --filter "$SMOKE_TESTS"
      - name: Publish
        run: packaging/publish-all.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: video-builder-${{ matrix.rid }}
          path: artifacts/publish/${{ matrix.rid }}
